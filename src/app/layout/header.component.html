<header
  class="sticky top-0 z-50 border-b transition-all duration-300"
  [class]="
    scrolled() ? 'border-line bg-surface/95 shadow-sm backdrop-blur-md' : 'border-line bg-surface'
  "
>
  <div
    class="mx-auto grid max-w-7xl grid-cols-[1fr_auto_1fr] items-center gap-3 px-5 py-3 sm:px-8 lg:gap-6"
  >
    <!-- The mark and the name are one link, so it is a single target rather
         than two adjacent ones. -->
    <a
      routerLink="/"
      class="group flex shrink-0 items-center gap-3"
      aria-label="{{ site.name }}, home"
    >
      <span
        class="bg-navy-800 group-hover:bg-blue-700 flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-white transition-colors"
      >
        <app-icon name="book" [size]="22" />
      </span>
      <span class="leading-tight">
        <span class="font-display text-navy-950 block text-lg font-semibold sm:text-xl">
          Anlaby Park
        </span>
        <span class="text-ink-muted block text-[0.68rem] font-semibold tracking-[0.14em] uppercase">
          Community Library
        </span>
      </span>
    </a>

    <!-- Nav takes the slack in the middle, so the header stays balanced rather
         than the links crowding the right-hand actions. -->
    <nav class="hidden items-center justify-center gap-0.5 lg:flex" aria-label="Main">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="!text-navy-900 !bg-blue-50"
          class="text-ink-soft hover:text-navy-900 hover:bg-sunken rounded-lg px-3 py-2 text-[0.9rem] font-medium whitespace-nowrap transition-colors"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="col-start-3 flex shrink-0 items-center justify-end gap-2">
      <a routerLink="/support" class="btn-accent btn-sm hidden lg:inline-flex">Donate</a>

      <button
        type="button"
        class="text-navy-900 hover:bg-sunken inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl lg:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        (click)="toggleMenu()"
      >
        <span class="sr-only">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="24" />
      </button>
    </div>
  </div>
</header>

<!-- Mobile drawer.

     A full-screen overlay carrying its own header bar rather than one offset
     beneath the site header: the dismissible notice above makes the header's
     height variable, so any fixed offset would eventually be wrong. -->
@if (menuOpen()) {
  <div
    id="mobile-menu"
    role="dialog"
    aria-modal="true"
    aria-label="Menu"
    class="drawer-enter bg-surface fixed inset-0 z-[60] flex flex-col lg:hidden"
  >
    <div class="border-line flex shrink-0 items-center gap-4 border-b px-5 py-3">
      <span class="flex items-center gap-3">
        <span
          class="bg-navy-800 flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-white"
        >
          <app-icon name="book" [size]="22" />
        </span>
        <span class="leading-tight">
          <span class="font-display text-navy-950 block text-lg font-semibold">Anlaby Park</span>
          <span
            class="text-ink-muted block text-[0.68rem] font-semibold tracking-[0.14em] uppercase"
          >
            Community Library
          </span>
        </span>
      </span>

      <button
        type="button"
        class="text-navy-900 hover:bg-sunken ml-auto inline-flex h-11 w-11 items-center justify-center rounded-xl"
        (click)="closeMenu()"
      >
        <span class="sr-only">Close menu</span>
        <app-icon name="close" [size]="24" />
      </button>
    </div>

    <div class="flex-1 overflow-y-auto px-5 pt-4 pb-10">
      <nav aria-label="Mobile">
        <ul class="flex flex-col">
          @for (item of navItems; track item.path) {
            <li>
              <a
                [routerLink]="item.path"
                routerLinkActive="!text-navy-800 !bg-blue-50"
                class="text-ink hover:bg-sunken flex items-center justify-between rounded-xl px-4 py-3.5 text-lg font-medium"
              >
                {{ item.label }}
                <app-icon name="arrowRight" [size]="18" />
              </a>
            </li>
          }
        </ul>
      </nav>

      <a routerLink="/support" class="btn-accent mt-5 w-full">
        <app-icon name="heart" [size]="18" />
        Donate to the library
      </a>

      <div class="border-line mt-6 flex flex-col gap-3 border-t pt-6 text-base">
        <a
          [href]="'tel:' + site.phoneHref"
          class="text-ink-soft flex min-h-11 items-center gap-3 px-1 py-1"
        >
          <app-icon name="phone" [size]="18" />
          {{ site.phone }}
        </a>
        <a
          [href]="'mailto:' + site.email"
          class="text-ink-soft flex min-h-11 items-center gap-3 px-1 py-1"
        >
          <app-icon name="mail" [size]="18" />
          <span class="break-all">{{ site.email }}</span>
        </a>
      </div>
    </div>
  </div>
}
